[package]
name = "sovereign-vault"
version = "0.1.0"
edition = "2021"
authors = ["Oakai Security <security@oakai-security.com>"]
description = "Single-binary, zero-account, containerized Micro-KMS with encrypted volume storage and memory-safe unsealing."
license = "Apache-2.0"
repository = "https://github.com/oakai-security/sovereign-vault"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
