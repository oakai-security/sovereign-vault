[package]
name = "sovereign-vault"
version = "0.2.0"
edition = "2021"
authors = ["Oakai Security <security@oakai-security.com>"]
description = "Single-binary, zero-account, containerized Micro-KMS with SQLCipher encrypted volume storage, SHA-512 machine tokens, and memory-pinned unsealing."
license = "Apache-2.0"
repository = "https://github.com/oakai-security/sovereign-vault"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
subtle = "2.6"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
rpassword = "7.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3.10"
http-body-util = "0.1"
