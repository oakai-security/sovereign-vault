services:
  sovereign-vault:
    build: .
    image: sovereign-vault:local
    container_name: sovereign-vault
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: 67108864
        hard: 67108864
    # Reverse-proxy loopback pattern:
    # Bind strictly to 127.0.0.1:8443 on `lo` (never 0.0.0.0 / LAN / VPN interfaces),
    # bypassing Docker bridge/VPN firewall drops while terminating TLS at host Caddy / Nginx.
    # (If running Caddy in a sibling container instead of on the host, replace `network_mode: host`
    #  with a shared `internal: true` Docker network and `--bind 0.0.0.0:8443`.)
    network_mode: host
    command: ["daemon", "--data-dir", "/data", "--bind", "127.0.0.1:8443"]
    # Standalone mode is 100% air-gapped (zero outbound calls).
    # Uncomment ONLY for Enterprise Fleet telemetry opt-in:
    # environment:
    #   - OAKAI_ENTERPRISE_LICENSE=${OAKAI_ENTERPRISE_LICENSE}
    #   - OAKAI_TELEMETRY_ENABLED=true
    #   - OAKAI_CLUSTER_ID=cls_local_dev
    volumes:
      - vault-data:/data

volumes:
  vault-data:
    name: sovereign_vault_data
