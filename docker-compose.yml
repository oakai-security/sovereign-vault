services:
  sovereign-vault:
    build: .
    image: sovereign-vault:local
    container_name: sovereign-vault
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: 67108864
        hard: 67108864
    # Native TLS 1.3 Mode:
    # Encrypted in transit by default (NIC-to-NIC wire encryption) using Rustls.
    # An autonomous self-signed ECDSA certificate is generated on first boot if custom certs are omitted.
    network_mode: host
    command: ["daemon", "--data-dir", "/data", "--bind", "0.0.0.0:8443"]
    environment:
      - SOVEREIGN_VAULT_TLS_SANS=${SOVEREIGN_VAULT_TLS_SANS:-localhost,127.0.0.1,vault.local}
      # Custom enterprise TLS certificates can be mounted and provided via:
      # - SOVEREIGN_VAULT_TLS_CERT=/data/tls/custom_cert.pem
      # - SOVEREIGN_VAULT_TLS_KEY=/data/tls/custom_key.pem
      #
      # Enterprise Fleet telemetry opt-in:
      # - OAKAI_ENTERPRISE_LICENSE=${OAKAI_ENTERPRISE_LICENSE}
      # - OAKAI_TELEMETRY_ENABLED=true
      # - OAKAI_CLUSTER_ID=cls_local_dev
    volumes:
      - vault-data:/data

volumes:
  vault-data:
    name: sovereign_vault_data
