services:
  sovereign-vault:
    build: .
    image: oakai/sovereign-vault:latest
    container_name: sovereign-vault
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - vault-data:/data
    ports:
      - "8443:8443"

volumes:
  vault-data:
    name: sovereign_vault_data
