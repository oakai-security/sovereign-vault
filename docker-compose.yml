services:
  sovereign-vault:
    build: .
    image: sovereign-vault:local
    container_name: sovereign-vault
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: 67108864
        hard: 67108864
    # Native Strict TLS 1.3 Mode:
    # Bound exclusively to host loopback (127.0.0.1:8443) inside an isolated Docker bridge network.
    ports:
      - "127.0.0.1:8443:8443"
    command: ["daemon", "--data-dir", "/data", "--bind", "0.0.0.0:8443"]
    environment:
      - SOVEREIGN_VAULT_TLS_SANS=${SOVEREIGN_VAULT_TLS_SANS:-localhost,127.0.0.1,sovereign-vault,vault.local}
      # Custom enterprise TLS certificates can be mounted and provided via:
      # - SOVEREIGN_VAULT_TLS_CERT=/data/tls/custom_cert.pem
      # - SOVEREIGN_VAULT_TLS_KEY=/data/tls/custom_key.pem
      #
      # Enterprise Fleet telemetry opt-in:
      # - OAKAI_ENTERPRISE_LICENSE=${OAKAI_ENTERPRISE_LICENSE}
      # - OAKAI_TELEMETRY_ENABLED=true
      # - OAKAI_CLUSTER_ID=cls_local_dev
    volumes:
      - vault-data:/data

volumes:
  vault-data:
    name: sovereign_vault_data
